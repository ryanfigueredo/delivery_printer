plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
}

android {
    namespace 'com.tamborilburguer.printer'
    compileSdk 34

    defaultConfig {
        applicationId "com.tamborilburguer.printer"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    
    kotlinOptions {
        jvmTarget = '17'
    }
    
    packagingOptions {
        exclude 'META-INF/api_release.kotlin_module'
        exclude 'META-INF/client_release.kotlin_module'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    
    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3'
    
    // Retrofit para requisições HTTP
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    
    // Lifecycle
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-service:2.7.0'
    
    // WorkManager (alternativa para background tasks)
    implementation 'androidx.work:work-runtime-ktx:2.9.0'
    
    // SDK Stone - Core (TEMPORARIAMENTE COMENTADO - Descomente quando tiver o token)
    // def stoneSdkVersion = rootProject.ext.has('stone_sdk_version') ? rootProject.ext.stone_sdk_version : '4.13.0'
    // implementation "br.com.stone:stone-sdk:$stoneSdkVersion"
    // implementation "br.com.stone:stone-sdk-posandroid:$stoneSdkVersion"
    
    // SDK Stone - Variantes por fabricante (descomente conforme necessário)
    // implementation "br.com.stone:stone-sdk-posandroid-ingenico:$stoneSdkVersion"
    // implementation "br.com.stone:stone-sdk-posandroid-sunmi:$stoneSdkVersion"
    // implementation "br.com.stone:stone-sdk-posandroid-tectoy:$stoneSdkVersion"
    // implementation "br.com.stone:stone-sdk-posandroid-gertec:$stoneSdkVersion"
    // implementation "br.com.stone:stone-sdk-posandroid-positivo:$stoneSdkVersion"
    
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
